services:
  - type: web
    name: edutrack
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      # Build-time URL the SPA bakes in to call the API (fixes the 400s).
      # Service is "edutrack" -> default onrender URL below; change if custom domain.
      - key: VITE_BASE44_APP_BASE_URL
        value: https://edutrack-ey49.onrender.com
